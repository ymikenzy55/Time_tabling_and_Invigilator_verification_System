# Render Blueprint — University Examination Management System
# Deploy via: Dashboard → New → Blueprint → select this repo
# or via CLI: render blueprint deploy
#
# The database is NOT managed by Render — it lives on Neon (https://neon.tech).
# Set DATABASE_URL manually in the Render dashboard using the Neon pooled
# connection string. See DEPLOYMENT.md for the full walkthrough.

services:
  # ── Backend: Express + Socket.IO API ──────────────────────────
  - type: web
    name: exam-management-server
    root: server
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false  # Neon pooled connection string (must include ?sslmode=require)
      - key: JWT_SECRET
        sync: false  # set manually in Render dashboard (min 16 chars)
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: QR_SIGNING_SECRET
        sync: false  # set manually in Render dashboard (min 16 chars)
      - key: CLIENT_ORIGIN
        value: https://exam-management-client.onrender.com
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_STAFF_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ── Frontend: React (Vite) static site ────────────────────────
  - type: web
    name: exam-management-client
    root: client
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://exam-management-server.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
