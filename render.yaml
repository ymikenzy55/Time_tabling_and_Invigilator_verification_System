# Render Blueprint — University Examination Management System
# Deploy via: Dashboard → New → Blueprint → select this repo
# or via CLI: render blueprint deploy
#
# The database is NOT managed by Render — it lives on Neon (https://neon.tech).
# Set DATABASE_URL manually in the Render dashboard using the Neon pooled
# connection string. See DEPLOYMENT.md for the full walkthrough.

services:
  # ── Backend: Express + Socket.IO API ──────────────────────────
  - type: web
    name: exam-management-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy; npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Neon pooled connection string (must include ?sslmode=require)
      - key: JWT_SECRET
        sync: false  # set manually in Render dashboard (min 16 chars)
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: QR_SIGNING_SECRET
        sync: false  # set manually in Render dashboard (min 16 chars)
      - key: CLIENT_ORIGIN
        sync: false  # set to your Vercel frontend URL
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_STAFF_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
