# fly.toml app configuration file generated for exam-management-server on 2026-08-25T13:21:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'exam-management-server'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  JWT_EXPIRES_IN = '1d'
  NODE_ENV = 'production'
  PORT = '8080'
  SMTP_PORT = '587'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
